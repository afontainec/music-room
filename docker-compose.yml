# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: music_room
      POSTGRES_PASSWORD: music_room
      POSTGRES_DB: music_room
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_room"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
