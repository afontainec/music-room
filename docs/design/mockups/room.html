<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: room page</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .page {
    --room-color: var(--room-moss);
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 56px 24px 40px;
    display: flex;
    flex-direction: column;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: var(--touch);
  }
  .back {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: var(--touch);
    font-size: 15px;
    color: var(--text-muted);
    text-decoration: none;
  }
  .back:hover {
    color: var(--text);
  }
  .visual {
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .visual svg {
    width: min(280px, 72vw);
    height: auto;
  }
  .layer {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 40px;
  }
  .layer-name {
    margin: 0;
    font-size: 48px;
    font-weight: 300;
    letter-spacing: -0.03em;
    line-height: 1;
    overflow-wrap: anywhere;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .icon-button {
    width: var(--touch);
    height: var(--touch);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .volume {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 2px;
    margin: 0;
    background: var(--border-strong);
  }
  .volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--text);
  }
  .volume::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border: 0;
    border-radius: 50%;
    background: var(--text);
  }
</style>
</head>
<body>
<main class="page">
  <div class="top">
    <a class="back" href="room-selection.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Rooms
    </a>
    <span class="label">Forest</span>
  </div>
  <div class="visual">
    <svg viewBox="0 0 280 280" fill="none" aria-hidden="true">
      <defs>
        <radialGradient id="glow">
          <stop offset="0%" stop-color="#7fbf95" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#7fbf95" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="140" cy="140" r="90" fill="url(#glow)"/>
      <circle cx="140" cy="140" r="138" stroke="#1b2220"/>
      <circle cx="140" cy="140" r="110" stroke="#26302c"/>
      <circle cx="140" cy="140" r="82" stroke="#36423d"/>
      <circle cx="140" cy="140" r="54" stroke="#7fbf95" stroke-width="1.5"/>
      <circle cx="140" cy="140" r="5" fill="#7fbf95"/>
    </svg>
  </div>
  <div class="layer">
    <span class="label">Your layer</span>
    <p class="layer-name">Birdsong</p>
  </div>
  <div class="controls">
    <button class="icon-button" type="button" aria-label="Mute">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
    </button>
    <label class="visually-hidden" for="volume">Volume</label>
    <input class="volume" id="volume" type="range" min="0" max="100" value="70">
  </div>
</main>
</body>
</html>
