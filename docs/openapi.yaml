openapi: 3.0.3
info:
  title: Music Rooms API
  version: 0.1.0
  description: Room admin API. Not behind authentication yet.
paths:
  /api/rooms:
    get:
      summary: List all rooms
      responses:
        '200':
          description: Rooms ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
    post:
      summary: Create a room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Unique, trimmed
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/rooms/{id}:
    get:
      summary: Room details with its file list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The room and its files
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Room'
                  - type: object
                    properties:
                      files:
                        type: array
                        items:
                          $ref: '#/components/schemas/RoomFile'
        '404':
          $ref: '#/components/responses/Error'
  /api/rooms/{id}/next-track:
    get:
      summary: A random track of the room to play next
      description: >-
        Never returns the track given as `after` (the one that just played), unless it is the
        room's only track. Play the returned track from `GET /api/files/{id}`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: after
          in: query
          required: false
          description: Id of the track that just played
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The picked track, or null when the room has no tracks
          content:
            application/json:
              schema:
                type: object
                required: [track]
                properties:
                  track:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/RoomFile'
        '404':
          $ref: '#/components/responses/Error'
  /api/rooms/{id}/presence/heartbeat:
    post:
      summary: Register or refresh a listening device in the room
      description: >-
        Send every few seconds while listening. A device stops counting as present 30 seconds
        after its last heartbeat. Presence is held in memory and is lost on a server restart;
        devices re-register with their next heartbeat.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{1,64}$'
                  description: Chosen by the device, e.g. a random UUID kept in storage
                trackId:
                  type: string
                  format: uuid
                  nullable: true
                  description: The track the device is playing, if any
      responses:
        '200':
          description: The device's presence entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentDevice'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/rooms/{id}/presence:
    get:
      summary: Devices currently present in the room
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Devices heard from in the last 30 seconds
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/PresentDevice'
        '404':
          $ref: '#/components/responses/Error'
  /api/rooms/{id}/presence/{deviceId}:
    delete:
      summary: Leave the room (removes the device immediately)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed
        '404':
          description: Unknown room, or the device is not present in it
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/rooms/{roomId}/files:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List a room's tracks with a display name and playable URL
      responses:
        '200':
          description: Every track of the room (an empty array when it has none)
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/RoomFile'
                    - type: object
                      required: [name, url]
                      properties:
                        name:
                          type: string
                          description: Original file name without its extension (the storage key or URL when unknown)
                        url:
                          type: string
                          description: Same-origin playback path, `/api/files/{id}`
        '404':
          $ref: '#/components/responses/Error'
    post:
      summary: Assign an uploaded mp3 to the room
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomFile'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/rooms/{roomId}/files/url:
    post:
      summary: Assign an external mp3 URL to the room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: http(s) URL ending in .mp3
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomFile'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/files/{id}:
    get:
      summary: Play a file (streams uploads with Range support, redirects URLs)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: audio/mpeg
        '206':
          description: Partial content
        '302':
          description: Redirect to the external URL
        '404':
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
  schemas:
    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RoomFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        source:
          type: string
          enum: [upload, url]
        fileRef:
          type: string
        originalName:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
        durationSeconds:
          type: number
          nullable: true
        position:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
    PresentDevice:
      type: object
      required: [deviceId, trackId, lastSeen]
      properties:
        deviceId:
          type: string
        trackId:
          type: string
          format: uuid
          nullable: true
        lastSeen:
          type: integer
          description: Time of the last heartbeat, in milliseconds since the epoch
