openapi: 3.0.3
info:
  title: Music Rooms API
  version: 0.1.0
  description: >-
    Room API. Admin operations (marked with `staffToken` security) need a bearer token from
    `POST /api/auth/login`; visitor routes are public.
paths:
  /api/auth/login:
    post:
      summary: Log in with the shared staff account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: A signed token, valid until `expiresAt` (`AUTH_TOKEN_TTL_SECONDS`, default 12 h). There is no refresh; log in again once it expires.
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  token:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          description: Staff login is not configured (`ADMIN_PASSWORD` unset)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/session:
    get:
      summary: The session of the given token
      security:
        - staffToken: []
      responses:
        '200':
          description: Valid session
          content:
            application/json:
              schema:
                type: object
                required: [username, expiresAt]
                properties:
                  username:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/rooms:
    get:
      summary: List all rooms
      responses:
        '200':
          description: Rooms ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
    post:
      summary: Create a room
      security:
        - staffToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Unique, trimmed
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Error'
  /api/rooms/{id}:
    get:
      summary: Room details with its file list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The room and its files
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Room'
                  - type: object
                    properties:
                      files:
                        type: array
                        items:
                          $ref: '#/components/schemas/RoomFile'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      summary: Rename a room
      security:
        - staffToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Unique, trimmed
      responses:
        '200':
          description: The renamed room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete a room with its tracks
      description: >-
        Deletes the room and its tracks in one transaction, then the uploaded mp3s (external URLs
        are only referenced, so nothing is fetched or deleted for them) and the devices present in
        the room. An mp3 that cannot be deleted is logged by the server; the room is deleted anyway.
      security:
        - staffToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
  /api/rooms/{id}/next-track:
    get:
      summary: A random track of the room to play next
      description: >-
        Never returns the track given as `after` (the one that just played), unless it is the
        room's only track. Play the returned track from `GET /api/files/{id}`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: after
          in: query
          required: false
          description: Id of the track that just played
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The picked track, or null when the room has no tracks
          content:
            application/json:
              schema:
                type: object
                required: [track]
                properties:
                  track:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/RoomFile'
        '404':
          $ref: '#/components/responses/Error'
  /api/rooms/{id}/presence/heartbeat:
    post:
      summary: Register or refresh a listening device in the room
      description: >-
        Send every few seconds while listening. A device stops counting as present 30 seconds
        after its last heartbeat. Presence is held in memory and is lost on a server restart;
        devices re-register with their next heartbeat.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{1,64}$'
                  description: Chosen by the device, e.g. a random UUID kept in storage
                trackId:
                  type: string
                  format: uuid
                  nullable: true
                  description: The track the device is playing, if any
      responses:
        '200':
          description: The device's presence entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentDevice'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/rooms/{id}/presence:
    get:
      summary: Devices currently present in the room
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Devices heard from in the last 30 seconds
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/PresentDevice'
        '404':
          $ref: '#/components/responses/Error'
  /api/rooms/{id}/layer:
    post:
      summary: Assign the device its soundscape layer
      description: >-
        Call when the device joins the room and again when its track ends. Returns the track
        played by the fewest other present devices (ties broken at random), so every track is in
        use once before any plays on two devices. Never returns the device's previous track
        unless it is the room's only one. The assignment is recorded as the device's presence
        heartbeat, with the returned track as its `trackId`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{1,64}$'
                previousTrackId:
                  type: string
                  format: uuid
                  nullable: true
                  description: >-
                    The track that just ended. Defaults to the device's current track in presence.
      responses:
        '200':
          description: The assigned layer, or `track` null with `reason` "no-tracks" for an empty room
          content:
            application/json:
              schema:
                type: object
                required: [track]
                properties:
                  track:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/Layer'
                  reason:
                    type: string
                    enum: [no-tracks]
                    description: Present only when `track` is null
                  message:
                    type: string
                    description: Present only when `track` is null
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/rooms/{id}/presence/{deviceId}:
    delete:
      summary: Leave the room (removes the device immediately)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed
        '404':
          description: Unknown room, or the device is not present in it
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/rooms/{roomId}/files:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List a room's tracks with a display name and playable URL
      responses:
        '200':
          description: Every track of the room (an empty array when it has none)
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/RoomFile'
                    - type: object
                      required: [name, url]
                      properties:
                        name:
                          type: string
                          description: Original file name without its extension (the storage key or URL when unknown)
                        url:
                          type: string
                          description: Same-origin playback path, `/api/files/{id}`
        '404':
          $ref: '#/components/responses/Error'
    post:
      summary: Assign an uploaded mp3 to the room
      security:
        - staffToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomFile'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
  /api/rooms/{roomId}/files/url:
    post:
      summary: Assign an external mp3 URL to the room
      security:
        - staffToken: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: http(s) URL ending in .mp3
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomFile'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
  /api/files/{id}:
    get:
      summary: Play a file (streams uploads with Range support, redirects URLs)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: audio/mpeg
        '206':
          description: Partial content
        '302':
          description: Redirect to the external URL
        '404':
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove a track from its room
      description: >-
        Deletes the track and, for an upload, its stored file. External URLs are only unlinked.
      security:
        - staffToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    staffToken:
      type: http
      scheme: bearer
      description: Token from `POST /api/auth/login`
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: >-
        No valid staff token (`Authentication required`) or an expired one (`Session expired, log in
        again`). Sent with `WWW-Authenticate: Bearer`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RoomFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        source:
          type: string
          enum: [upload, url]
        fileRef:
          type: string
        originalName:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
        durationSeconds:
          type: number
          nullable: true
        position:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
    PresentDevice:
      type: object
      required: [deviceId, trackId, lastSeen]
      properties:
        deviceId:
          type: string
        trackId:
          type: string
          format: uuid
          nullable: true
        lastSeen:
          type: integer
          description: Time of the last heartbeat, in milliseconds since the epoch
    Layer:
      type: object
      required: [id, name, url]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The track's file name without extension
        url:
          type: string
          description: Playable path, `/api/files/{id}`
