name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    # Same Postgres as ci.yml: the Playwright web server migrates and uses it
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: music_room
          POSTGRES_PASSWORD: music_room
          POSTGRES_DB: music_room
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U music_room"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://music_room:music_room@localhost:5432/music_room
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Install up front so Claude starts with dependencies in place
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Lets Claude add packages, build and run the tests CLAUDE.md requires before a PR,
          # and open the PR itself instead of leaving a "Create PR" link
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash(npm install *),Bash(npm ci),Bash(npm run *),Bash(npm test *),Bash(npx playwright *),Bash(gh pr create *)"

      # The action logs only how many tool calls were refused; this puts which ones, and Claude's
      # final message, in the job summary, so a run that stops early shows why.
      - name: Report the run
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: .github/scripts/claude-run-report.sh "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY" || echo "Could not read $EXECUTION_FILE"
