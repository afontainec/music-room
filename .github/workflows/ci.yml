name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - id: e2e
        run: npm run test:e2e
      - id: report
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Post e2e recording summary
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.e2e.outcome }}
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Empty on push events and on fork PRs, whose token cannot comment
          PR_NUMBER: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number || '' }}
        run: |
          .github/scripts/e2e-summary.sh > e2e-summary.md
          cat e2e-summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file e2e-summary.md
          fi
